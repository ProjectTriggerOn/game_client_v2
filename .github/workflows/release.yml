name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Serialize by tag: a force-repushed identical tag won't race two runs against
# the same GitHub Release (duplicate-asset / partial-update). Distinct tags
# already yield distinct artifacts, so this only ever gates same-tag reruns.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    environment: production-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild TriggerOn.sln /p:Configuration=Release /p:Platform=x64

      - name: Stage release files
        shell: pwsh
        run: |
          # Fail-fast: any missing source or copy error aborts the run BEFORE a
          # broken ZIP is published (the old shell:cmd block ignored intermediate
          # copy failures and could ship an incomplete release with a green run).
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release\bin, release\config | Out-Null

          # --- App binary at the root; every DLL tucked into bin\ (the exe adds
          #     bin\ to its DLL search path at startup — see main.cpp) ---
          Copy-Item x64\Release\TriggerOn.exe      release\
          Copy-Item assimp-vc143-mt.dll            release\bin\
          Copy-Item x64\Release\Ultralight.dll     release\bin\
          Copy-Item x64\Release\UltralightCore.dll release\bin\
          Copy-Item x64\Release\WebCore.dll        release\bin\
          Copy-Item x64\Release\AppCore.dll        release\bin\

          # --- Config (defaults only; user_settings.toml is written at runtime) ---
          Copy-Item config\config.toml release\config\

          # --- Asset tree. Ultralight's engine data rides along inside it at
          #     resource\ultralight\resources (post-build mirrors it there), so
          #     there is no second near-identical "resources\" folder any more. ---
          Copy-Item resource release\resource -Recurse

          # --- Visual C++ 2015-2022 runtime, app-local -------------------------
          # The vendored Ultralight + assimp DLLs are built /MD and import
          # MSVCP140*/VCRUNTIME140*; a clean Windows install ships only the UCRT,
          # not these — without them TriggerOn.exe fails to launch on a fresh box
          # ("VCRUNTIME140.dll was not found"). The exe itself is /MT so it needs
          # none of its own; the dependency comes from the closed-source DLLs.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsRoot) { throw 'vswhere could not locate a Visual Studio installation' }
          $crtDir = Get-ChildItem "$vsRoot\VC\Redist\MSVC" -Directory |
                    Sort-Object Name -Descending |
                    ForEach-Object { Join-Path $_.FullName 'x64\Microsoft.VC143.CRT' } |
                    Where-Object { Test-Path $_ } |
                    Select-Object -First 1
          if (-not $crtDir) { throw "No Microsoft.VC143.CRT redist found under $vsRoot\VC\Redist\MSVC" }
          Copy-Item "$crtDir\*.dll" release\bin\
          Write-Host "Staged VC++ redist from: $crtDir"

          # --- Manifest assertion: fail before publishing if anything is missing.
          # Deep paths (icudt67l.dat, ui\index.html) also guard against a silent
          # post-build miss that would ship a white-screen / crashing build.
          $required = @(
            'release\TriggerOn.exe',
            'release\bin\assimp-vc143-mt.dll',
            'release\bin\Ultralight.dll',
            'release\bin\UltralightCore.dll',
            'release\bin\WebCore.dll',
            'release\bin\AppCore.dll',
            'release\bin\msvcp140.dll',
            'release\bin\vcruntime140.dll',
            'release\bin\vcruntime140_1.dll',
            'release\config\config.toml',
            'release\resource\ultralight\resources\icudt67l.dat',
            'release\resource\ultralight\resources\cacert.pem',
            'release\resource\ui\index.html',
            'release\resource\shader'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) {
            Write-Host 'Missing required files:'
            $missing | ForEach-Object { Write-Host "  $_" }
            throw "Release staging incomplete: $($missing.Count) required file(s) missing"
          }
          Write-Host 'Release payload (root):'
          Get-ChildItem release | Format-Table Name, Length -AutoSize
          Write-Host 'Release payload (bin):'
          Get-ChildItem release\bin | Format-Table Name, Length -AutoSize

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath TriggerOn-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TriggerOn-${{ github.ref_name }}.zip
          generate_release_notes: true
          # A tag containing '-' (v1.0.0-rc1, v2.0.0-beta) publishes as a
          # pre-release instead of becoming the public "Latest" download.
          prerelease: ${{ contains(github.ref_name, '-') }}
