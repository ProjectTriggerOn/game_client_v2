# =============================================================================
# TriggerOn Client — Configuration
# =============================================================================

[network]
# Network mode: "mock" | "local" | "remote"
#   mock   — in-process mock server (no real networking)
#   local  — ENet connection to local machine (127.0.0.1)
#   remote — ENet connection to remote server
mode = "mock"

server_port = 7777

# Server addresses per mode
local_host  = "127.0.0.1"
remote_host = "127.0.0.1"

[client]
# Legacy window size (kept for back-compat). Display settings below take
# precedence when [display].width/height are > 0. See Core/display_manager.
window_width  = 1920
window_height = 1080

# =============================================================================
# Display / window settings (Core/display_manager.cpp).
#   mode / width / height / monitor_index change through the settings-page
#   APPLY button and are confirmed with a 15s auto-revert (a bad/black-screen
#   mode restores itself). vsync / fov / max_fps apply live like input.*.
# =============================================================================
[display]
# Display mode: "windowed" | "borderless" | "exclusive"
#   windowed   — bordered, non-resizable, centered on the chosen monitor
#   borderless — WS_POPUP covering the whole monitor (always native resolution)
#   exclusive  — true DXGI fullscreen + mode switch (honors width/height)
mode          = "windowed"

# Render resolution. 0 = "Native/Auto": borderless/exclusive use the monitor's
# desktop resolution; windowed falls back to [client].window_width/height (a
# desktop-sized *window* would overflow its title bar). Concrete values are
# honored as-is in windowed and exclusive; borderless is always native.
width         = 1920
height        = 1080

# UI filter only (does not affect rendering): "all" | "16:9" | "16:10" | "21:9" | "4:3"
aspect_ratio  = "all"

# DXGI output index (0 = primary) — which monitor the game targets.
monitor_index = 0

# --- live keys (apply instantly via Config subscribers, no confirm dialog) ---
vsync         = true    # Present() sync interval 1 vs 0
fov           = 90.0    # FPS camera VERTICAL field of view, in degrees
max_fps       = 0       # frame cap; 0 = uncapped (only bites when vsync = false)

# =============================================================================
# Generic file logger (single-threaded). See Core/debug_log.h.
# Each startup creates "<root>/<YYYY-MM-DD_HH-MM-SS>/" and writes one file
# per category lazily (e.g. jump.log, corr.log, phys.log).
# =============================================================================
[log]
enabled = true
root    = "logs"

# =============================================================================
# Gameplay diagnostic filters consumed by callers of DebugLog_Printf.
# =============================================================================
[debug]
# Boot scene: "game" | "title" | "ui_test" | "editor"
#   title   — Ultralight title menu (PLAY / SETTINGS / QUIT)
#   ui_test — UI development sandbox: no gameplay, no 3D, all input to Ultralight
#   editor  — in-engine level editor: free-fly camera, renders/edits a .map
start_scene             = "title"
error_threshold         = 0.5    # CORR rows with err <= this are skipped (unless log_every_correction)
log_every_correction    = false  # log every server correction (noisy)
log_jump_events         = true
log_softmode_state      = true   # log SOFT_FALLBACK + periodic SOFT_PERSIST samples
softmode_sample_ticks   = 16     # sample period during SOFT (32Hz tick → ~0.5s)
