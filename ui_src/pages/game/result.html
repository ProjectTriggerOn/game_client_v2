<!-- result.html — match-end screen injected into #page-result.
     Populated by window.onMatchResult(json) (C++ UI::PushMatchResult). -->

<div class="result-root">
    <div class="result-winner">—</div>

    <div class="result-score">
        <span class="result-red">0</span>
        <span class="result-sep">:</span>
        <span class="result-blue">0</span>
    </div>

    <div class="result-scoreboard">
        <div class="sb-col sb-red">
            <div class="sb-head">RED</div>
            <div class="sb-rows"></div>
        </div>
        <div class="sb-col sb-blue">
            <div class="sb-head">BLUE</div>
            <div class="sb-rows"></div>
        </div>
    </div>

    <button id="result-return" type="button">RETURN TO TITLE</button>
</div>
