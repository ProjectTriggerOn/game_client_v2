<!-- hud.html — bare markup injected into #page-hud -->
<!-- crosshair is drawn natively (docs §12.1), not here -->

<div class="hud-bottom-left">
    <div class="hud-hp-label">HP</div>
    <div class="hud-hp-bar">
        <div class="hud-hp-fill"></div>
    </div>
    <!-- sentinel placeholders: replaced by the first C++ push (proves the
         push channel works; if they stay "--" the push never arrived) -->
    <div class="hud-hp-text">-- / --</div>
</div>

<div class="hud-bottom-right">
    <div class="hud-ammo-current">--</div>
    <div class="hud-ammo-sep">/</div>
    <div class="hud-ammo-reserve">--</div>
</div>

<div class="hud-top-center">
    <div class="hud-score-line">
        <span class="hud-score hud-score-red">0</span>
        <span class="hud-score-sep">:</span>
        <span class="hud-score hud-score-blue">0</span>
    </div>
    <div class="hud-match-timer">--:--</div>
</div>

<!-- Kill feed: transient rows prepended by onKillFeed, auto-removed after a few s -->
<div class="hud-killfeed"></div>

<!-- Scoreboard overlay (Tab-hold). Uses its OWN .hidden toggle, separate from
     the router's .page.hidden, so it never fights UIPolicy's page ownership. -->
<div class="hud-scoreboard hidden">
    <div class="sb-col sb-red">
        <div class="sb-head">RED</div>
        <div class="sb-rows"></div>
    </div>
    <div class="sb-col sb-blue">
        <div class="sb-head">BLUE</div>
        <div class="sb-rows"></div>
    </div>
</div>
