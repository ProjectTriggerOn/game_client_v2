<!DOCTYPE html>
<!--
  dev.html —— 浏览器侧开发入口
  ============================
  和 index.html 的唯一区别是先加载 dev/mock_bridge.js，
  在浏览器里 stub 出 game.* API + 加上一个 dev overlay。

  打开方式（推荐 VS Code Live Server 插件）：
    1. 在 VS Code 里安装 "Live Server" 扩展
    2. 在本文件上右键 → "Open with Live Server"
    3. 浏览器自动打开 http://127.0.0.1:5500/.../dev.html

  或命令行：
    cd game_client/ui_src
    python -m http.server 8000
    # 浏览器访问 http://127.0.0.1:8000/dev.html

  千万不要直接双击 dev.html —— file:// 协议下 fetch('pages/...') 会被 CORS 拒绝，
  router.js 加载页面 markup 时全部失败、屏幕空白。
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>TriggerOn UI [DEV]</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="pages/title.css">
    <link rel="stylesheet" href="pages/hud.css">
    <style>
        /* 浏览器里没有底下的 3D 场景，给个深灰背景便于看透明 UI */
        html, body { background: #2a2a2a; }
    </style>
</head>
<body>
    <div id="page-title" class="page hidden"></div>
    <div id="page-hud"   class="page hidden"></div>

    <!-- Mock bridge 必须在 router.js / 页面 JS 之前加载，
         以便它们一启动就能调用 game.* 而不报错 -->
    <script src="dev/mock_bridge.js"></script>

    <script src="pages/title.js"></script>
    <script src="pages/hud.js"></script>
    <script src="router.js"></script>
</body>
</html>
